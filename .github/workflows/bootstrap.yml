name: Bootstrap Fase 1 (backend)

# Workaround: el conector de Claude para GitHub es de solo lectura y no puede
# subir archivos. Esta Action los lleva empaquetados (tar.gz en base64) y los
# materializa ella misma en el repo, commiteando con el GITHUB_TOKEN (que sí
# tiene permiso de escritura). Se dispara al hacer commit de este archivo.
# Cuando termine, puedes borrar este workflow: ya habrá hecho su trabajo.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar archivos de la Fase 1
        run: |
          echo '' | base64 -d | tar xzf -

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: los archivos ya estaban en el repo."
          else
            git commit -m "Fase 1: backend (esquema MariaDB + API PHP) [vía Actions]"
            git push
          fi
