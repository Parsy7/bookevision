name: Bootstrap Fase 3 - modelos y servicios

# Mismo mecanismo que las fases anteriores: el conector de Claude es de solo
# lectura, asi que esta Action lleva los archivos empaquetados (base64) y los
# materializa ella misma, commiteando con el GITHUB_TOKEN. Se dispara al hacer
# commit de este archivo. Cuando termine, puedes borrarlo.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-fase3.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
