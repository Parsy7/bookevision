name: Bootstrap Fase 2 (Flutter: tema + widgets)

# Mismo mecanismo que la Fase 1: como el conector de Claude es de solo lectura,
# esta Action lleva los archivos Flutter empaquetados y los materializa ella
# misma, commiteando con el GITHUB_TOKEN. Se dispara al hacer commit de este
# archivo. Cuando termine, puedes borrarlo.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-fase2.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materializar archivos de la Fase 2
        run: |
          echo '' | base64 -d | tar xzf -

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: los archivos ya estaban en el repo."
          else
            git commit -m "Fase 2: tema Flutter + widgets genéricos [vía Actions]"
            git push
          fi
