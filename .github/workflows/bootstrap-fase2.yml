name: Bootstrap Fase 2 - Flutter (tema y widgets)

# Mismo mecanismo que la Fase 1: como el conector de Claude es de solo lectura,
# esta Action lleva los archivos Flutter empaquetados (base64) y los materializa
# ella misma, commiteando con el GITHUB_TOKEN. Se dispara al hacer commit de
# este archivo. Cuando termine, puedes borrarlo.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap-fase2.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
