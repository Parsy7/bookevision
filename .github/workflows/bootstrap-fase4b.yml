      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sin cambios: los archivos ya estaban en el repo."
          else
            git commit -m "Fase 4B - lector con tarjetas, edicion manual, preview, confirmacion y export [via Actions]"
            git push
          fi
