name: bookevision
description: Revisor de capítulos de «La jaula rota» — aplica sugerencias de edición y edición manual de bloques.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.1
  intl: 0.20.2
  provider: ^6.1.2
  share_plus: 12.0.2
  path_provider: ^2.1.3
  file_picker: ^8.1.6
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

# Icono de la app. El repo no lleva android/ (lo genera el CI con
# `flutter create`), así que el CI corre `dart run flutter_launcher_icons`
# después de generarlo. Fondo y marca salen del logo (ver BRAND_GUIDE.md →
# Marca). windows/ sí va en el repo, con windows/runner/resources/app_icon.ico
# hecho a partir de assets/logo/logo.png.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/logo.png
  adaptive_icon_background: "#232A42"
  adaptive_icon_foreground: assets/logo/icono_primer_plano.png
  min_sdk_android: 21

# Pantalla de arranque nativa: solo el azul del logo, sin imagen, para que
# no haya un destello blanco antes de la pantalla de carga de Flutter (que
# es la que hace aparecer la B con el fundido). En Android 12+ el sistema
# siempre pinta un icono: se le da uno transparente.
flutter_native_splash:
  color: "#232A42"
  android_12:
    color: "#232A42"
    image: assets/logo/vacio.png
  ios: false
  web: false
