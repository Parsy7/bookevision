name: bookevision
description: Revisor de capítulos de «La jaula rota» — aplica sugerencias de edición y edición manual de bloques.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  http: ^1.2.1
  intl: 0.20.2
  provider: ^6.1.2
  share_plus: 12.0.2
  path_provider: ^2.1.3
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
